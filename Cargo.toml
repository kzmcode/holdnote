[package]
name = "holdnote"
version = "0.1.1"
edition = "2021"
description = "HoldNote - hold-to-record voice memo for macOS (Google Drive API)"
license = "MIT"

[[bin]]
name = "holdnote"
path = "src/main.rs"

[dependencies]
tao = "0.37"
tray-icon = "0.26"
global-hotkey = "0.8"
cpal = "0.18"
hound = "3.5"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
url = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
